<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../shared/tailwind-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="bg-page text-navy antialiased">
  <div class="flex min-h-screen items-center justify-center bg-page px-4">
    <div class="w-full max-w-sm rounded-card border border-border bg-white p-8">
      <div class="mb-6 flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-md bg-navy text-sm font-bold text-white">M</span>
        <span class="text-base font-semibold text-navy">CRM</span>
      </div>

      <h1 class="mb-1 text-lg font-semibold text-navy">Log in</h1>
      <p class="mb-6 text-sm text-muted">Sample CRM — demo environment.</p>

      <form id="login-form" class="space-y-4" novalidate>
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-navy">Email</label>
          <input id="email" type="email" autocomplete="email" required value="admin@example.com"
            class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-navy placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-action/40 focus:border-action" />
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm font-medium text-navy">Password</label>
          <input id="password" type="password" autocomplete="current-password" required
            class="w-full rounded-md border border-border bg-white px-3 py-2 text-sm text-navy placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-action/40 focus:border-action" />
        </div>
        <p id="login-error" role="alert" class="hidden rounded-md bg-danger/10 px-3 py-2 text-sm text-danger"></p>
        <button type="submit" id="login-submit"
          class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-action px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-action/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-action disabled:opacity-50">
          Log in
        </button>
      </form>

      <p class="mt-6 text-xs text-muted">
        Demo login: <code>admin@example.com</code> with the seeded demo password.
      </p>
    </div>
  </div>

  <script src="../../shared/api-base.js"></script>
  <script src="../../shared/api.js"></script>
  <script src="../../shared/format.js"></script>
  <script src="login.js"></script>
</body>
</html>
